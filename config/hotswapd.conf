<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root is allowed to own the hotswapd service name -->
  <policy user="root">
    <allow own="org.postmarketos.HotSwap"/>
    <allow send_destination="org.postmarketos.HotSwap"/>
  </policy>

  <!-- Read-only queries and signals are available to normal clients. -->
  <policy context="default">
    <allow send_destination="org.postmarketos.HotSwap"
           send_interface="org.postmarketos.HotSwap"
           send_member="ListModules"/>
    <allow send_destination="org.postmarketos.HotSwap"
           send_interface="org.postmarketos.HotSwap"
           send_member="GetModuleInfo"/>
    <allow send_destination="org.postmarketos.HotSwap"
           send_interface="org.postmarketos.HotSwap"
           send_member="GetTotalPowerDraw"/>
    <allow send_destination="org.postmarketos.HotSwap"
           send_interface="org.postmarketos.HotSwap"
           send_member="ListRegistry"/>
    <allow receive_sender="org.postmarketos.HotSwap"/>
  </policy>
</busconfig>
